# Netlify build configuration for mlgill.github.io
# Builds Jekyll site and generates CV PDFs

[build]
  # Build command: Jekyll build only (PDF generation disabled until formatting is fixed)
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.10"
  NODE_VERSION = "20"
  # Netlify's Ubuntu image has Chrome at this path
  CHROME_PATH = "/usr/bin/google-chrome-stable"

# Redirects (if needed)
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301
