# Netlify build configuration for mlgill.github.io
# Builds Jekyll site and generates CV PDFs

[build]
  # Build command: Clean + Jekyll build + PDF generation
  # Uses Puppeteer's bundled Chromium for PDF generation
  # Set SKIP_PDF_GENERATION=true in Netlify env vars to skip PDF generation
  command = """
echo "Cleaning build artifacts..." && \
rm -rf _site assets/pdf/cv && \
bundle exec jekyll build && \
if [ "$SKIP_PDF_GENERATION" = "true" ]; then \
  echo "Skipping PDF generation (SKIP_PDF_GENERATION=true)"; \
else \
  cd scripts && npm install && node generate-cv-pdf.js --file; \
fi
"""
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.10"
  NODE_VERSION = "20"

# Redirects (if needed)
