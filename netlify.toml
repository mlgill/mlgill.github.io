# Netlify build configuration for mlgill.github.io
# Builds Jekyll site and generates CV PDFs

[build]
  # Build command: Jekyll build, then generate PDFs from built files
  command = "bundle exec jekyll build && cd scripts && npm install && node generate-cv-pdf.js --file"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.10"
  NODE_VERSION = "20"
  # Netlify's Ubuntu image has Chrome at this path
  CHROME_PATH = "/usr/bin/google-chrome-stable"

# Redirects (if needed)
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301
