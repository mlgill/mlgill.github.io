name: Site and CV visual tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  test:
    # Pin the macOS major to reduce drift from macos-latest upgrades.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install PDF and image processing tools
        run: |
          brew install poppler imagemagick
          command -v convert

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: .cache/puppeteer
          key: ${{ runner.os }}-${{ runner.arch }}-puppeteer-${{ hashFiles('scripts/package-lock.json', '.puppeteerrc.cjs') }}

      - name: Prepare site and visual checks
        id: visual_prepare
        run: bash scripts/site.sh visual:prepare

      - name: Run browser visual checks
        if: ${{ !cancelled() && steps.visual_prepare.outcome == 'success' }}
        run: bash scripts/site.sh visual:browser

      - name: Run PDF visual checks
        if: ${{ !cancelled() && steps.visual_prepare.outcome == 'success' }}
        run: bash scripts/site.sh visual:pdf

      - name: Upload PDF visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf-visual-differences
          path: tmp/pdfs/visual-diffs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-differences
          path: tmp/browser/visual-diffs
          if-no-files-found: ignore
          retention-days: 7
