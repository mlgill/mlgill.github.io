# Bio information for CV and about pages

name: Michelle Lynn Gill, PhD
# Shared role, used by the about page, the CV, and the landing-page metadata.
role:
  title: "Applied Research Manager"
  organization: "NVIDIA"
  organization_url: "https://www.nvidia.com/"
  team: "BioNeMo Team"

bio: |
  I am an Applied Research Manager on NVIDIA’s BioNeMo team, where I lead a cross-functional effort to train NVIDIA’s Nemotron reasoning models for chemistry and drug-discovery applications. My team develops post-training and evaluation data, benchmarks, and metrics that guide model development.

  Previously, as a Senior Data Scientist and Machine Learning Engineer at BenevolentAI, I applied machine learning to study drug mechanisms and predict ligand binding poses and affinities. Earlier, as a postdoctoral fellow in [Arthur Palmer’s](https://www.biochem.cumc.columbia.edu/research-labs/palmer-lab) group at Columbia University, I developed and applied nuclear magnetic resonance (NMR) spin relaxation experiments to study how enzyme dynamics shape biological function.

specialized_in: "Deep learning, computational biology, drug discovery, benchmarking"
research_interests: "Virtual cell models, proteomics, NMR spectroscopy, enzyme dynamics"
